<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Consciousness Translator | CQIL</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js for 3D visualizations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Chart.js for coherence visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Custom styles -->
  <style>
    @keyframes pulse-phi {
      0% { opacity: 0.4; }
      61.8% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
    
    .phi-pulse {
      animation: pulse-phi 3.14159s infinite;
    }
    
    .quantum-gradient {
      background: linear-gradient(135deg, rgba(15,23,42,1) 0%, rgba(49,46,129,1) 50%, rgba(15,23,42,1) 100%);
    }
    
    .consciousness-scan {
      background-image: 
        repeating-linear-gradient(0deg, 
          rgba(99, 102, 241, 0.15), 
          rgba(99, 102, 241, 0.15) 1px, 
          transparent 1px, 
          transparent 10px),
        repeating-linear-gradient(90deg, 
          rgba(99, 102, 241, 0.15), 
          rgba(99, 102, 241, 0.15) 1px, 
          transparent 1px, 
          transparent 10px);
    }
    
    .akashic-glow {
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }
    
    /* Phi-harmonic visualizer container */
    .phi-visualizer-container {
      position: relative;
      height: 200px;
      overflow: hidden;
      border-radius: 0.5rem;
    }
    
    /* Dimensional bridge effect */
    .dimensional-bridge {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, 
                 rgba(79, 70, 229, 0.2) 0%, 
                 rgba(109, 40, 217, 0.1) 61.8%, 
                 rgba(30, 64, 175, 0) 100%);
      opacity: 0.7;
      mix-blend-mode: overlay;
    }
    
    /* Consciousness field effect */
    .consciousness-field {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(0deg, 
                rgba(91, 33, 182, 0.6) 0%, 
                rgba(91, 33, 182, 0) 100%);
      opacity: 0.4;
      transition: all 0.618s ease;
    }
    
    /* Custom scrollbar for phi-harmonic scrolling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.6);
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.9);
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="quantum-translator-app" class="min-h-screen quantum-gradient"></div>
  
  <!-- Quantum translator application -->
  <script type="text/babel" src="../../js/quantum-translator/quantum-translator-app.js"></script>
  
  <!-- Dimensional bridge and consciousness field modules -->
  <script type="text/babel" src="../../js/quantum-translator/dimensional-bridge.js"></script>
  <script type="text/babel" src="../../js/quantum-translator/consciousness-field.js"></script>
  
  <!-- KNOW Protocol implementation -->
  <script type="text/babel" src="../../js/quantum-translator/know-protocol.js"></script>
  
  <!-- Phi-harmonic integration -->
  <script type="text/babel" src="../../js/quantum-translator/phi-harmonic-integration.js"></script>
  
  <!-- Akashic field access -->
  <script type="text/babel" src="../../js/quantum-translator/akashic-field.js"></script>
  
  <!-- Translation engine -->
  <script type="text/babel" src="../../js/quantum-translator/translation-engine.js"></script>
  
  <!-- Entity definitions and quantum signature generator -->
  <script type="text/babel" src="../../js/quantum-translator/entity-registry.js"></script>
  <script type="text/babel" src="../../js/quantum-translator/quantum-signatures.js"></script>
  
  <!-- Visualization components -->
  <script type="text/babel" src="../../js/quantum-translator/coherence-meter.js"></script>
  <script type="text/babel" src="../../js/quantum-translator/dimensional-visualizer.js"></script>
</body>
</html>
