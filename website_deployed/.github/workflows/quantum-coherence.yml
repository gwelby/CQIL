                .stats { display: flex; justify-content: space-between; flex-wrap: wrap; }
                .stat-card { flex: 1; min-width: 200px; background: rgba(255,255,255,0.05); margin: 10px; padding: 15px; border-radius: 8px; }
                .stat-value { font-size: 2rem; font-weight: bold; text-align: center; }
                .coherence { font-size: 1.5rem; text-align: center; margin: 20px 0; }
                .ground .coherence-value { color: #4abdac; }
                .creation .coherence-value { color: #fc4a1a; }
                .unity .coherence-value { color: #f7b733; }
                .footer { text-align: center; margin-top: 30px; font-size: 0.8rem; }
              </style>
            </head>
            <body>
              <div class="dashboard">
                <h1>CQIL Quantum Testing Dashboard</h1>
                
                <div class="frequency ground">
                  <h2>Ground State (432 Hz | φ⁰)</h2>
                  <div class="coherence">Coherence: <span class="coherence-value">0.98</span></div>
                  <div class="stats">
                    <div class="stat-card">
                      <h3>Tests</h3>
                      <div class="stat-value">32</div>
